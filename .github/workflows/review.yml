name: Review cartridge
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    name: Validate cartridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only trusted base-branch tooling runs. PR files are fetched as data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate submission and create review ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/catalog_pipeline.py check-pr --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cartridge-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review
          retention-days: 14
